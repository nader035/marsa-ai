@if (showSplash()) {
  <div class="splash-screen" [class.hidden-splash]="hideSplashAnim()">
    <div class="wave-circle"></div>
    <div class="wave-circle"></div>
    <div class="wave-circle"></div>
    <span class="absolute text-primary-accent font-sans font-bold text-sm tracking-widest uppercase mt-32 animate-pulse-slow">
      {{ 'splash.loading' | transloco }}
    </span>
  </div>
}

<app-navbar
  [isDark]="isDarkMode()"
  [lang]="currentLang()"
  (toggleTheme)="onThemeToggle()"
  (toggleLang)="onLanguageToggle()"
></app-navbar>

<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
  <div
    class="absolute top-[10%] left-[-5%] w-[600px] h-[600px] blur-[150px] rounded-full transition-all duration-1000 animate-pulse-slow"
    [style.backgroundColor]="'var(--glow-color)'"
    [style.opacity]="isDarkMode() ? '0.6' : '0.4'"
  ></div>

  <div
    class="absolute bottom-[-10%] right-[-10%] w-[400px] h-[400px] bg-primary-accent/5 blur-[120px] rounded-full transition-opacity duration-1000"
    [class.opacity-0]="!isDarkMode()"
  ></div>
</div>

<div class="flex flex-col min-h-screen relative z-10">
  <main class="flex-grow w-full max-w-7xl mx-auto px-6 pt-32 pb-12 flex flex-col">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-16 items-start w-full">
      <div class="lg:col-span-7 animate-fade-in w-full">
        <app-chat-area [lang]="currentLang()"></app-chat-area>
      </div>

      <div
        class="lg:col-span-5 sticky top-32 animate-fade-in [animation-delay:300ms] flex justify-center w-full"
      >
        <app-card-preview [lang]="currentLang()" [isDarkMode]="isDarkMode()"></app-card-preview>
      </div>
    </div>
  </main>

  <app-footer [lang]="currentLang()"></app-footer>
</div>
