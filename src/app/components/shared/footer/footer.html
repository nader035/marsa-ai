<footer
  class="relative py-12 md:py-16 overflow-hidden bg-transparent transition-colors duration-500"
>
  <div
    class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-Marsa-gold/30 to-transparent z-10"
  ></div>

  <div class="max-w-7xl mx-auto px-6 relative z-20">
    <div class="flex flex-col lg:flex-row items-center justify-between gap-12">
      <div class="flex flex-col items-center lg:items-start gap-3">
        <a class="flex items-center gap-2 group cursor-pointer">
          <span
            class="font-sans font-bold text-2xl md:text-3xl text-[var(--color-foreground)] group-hover:text-Marsa-gold transition-colors duration-500"
            >Marsa</span
          >
          <span class="text-Marsa-gold font-sans font-bold text-2xl md:text-3xl">مَرسىء</span>
        </a>
      </div>

      <div class="flex flex-col items-center gap-2 text-center">
        <p class="text-[9px] font-sans font-bold tracking-[0.5em] text-Marsa-gold/60 uppercase">
          {{ lang() === 'ar' ? 'صُمم بشغف بواسطة' : 'Architected with Purpose by' }}
        </p>
        <span
          class="text-lg md:text-xl font-sans font-bold text-[var(--color-foreground)] uppercase"
        >
          Nader <span class="text-Marsa-gold">Mohamed</span>
        </span>
      </div>

      <div class="flex items-center gap-3">
        <a
          href="https://github.com/nader035"
          target="_blank"
          class="w-10 h-10 rounded-xl Marsa-glass flex items-center justify-center text-[var(--color-foreground)] opacity-70 hover:opacity-100 hover:text-Marsa-gold hover:border-Marsa-gold/40 transition-all duration-500 hover:-translate-y-1 shadow-sm"
        >
          <fa-icon [icon]="githubIcon" class="text-xl"></fa-icon>
        </a>
        <a
          href="https://x.com/nader0305"
          target="_blank"
          class="w-10 h-10 rounded-xl Marsa-glass flex items-center justify-center text-[var(--color-foreground)] opacity-70 hover:opacity-100 hover:text-Marsa-gold hover:border-Marsa-gold/40 transition-all duration-500 hover:-translate-y-1 shadow-sm"
        >
          <fa-icon [icon]="xIcon" class="text-lg"></fa-icon>
        </a>
        <a
          href="https://www.linkedin.com/in/nader0305/"
          target="_blank"
          class="w-10 h-10 rounded-xl Marsa-glass flex items-center justify-center text-[var(--color-foreground)] opacity-70 hover:opacity-100 hover:text-Marsa-gold hover:border-Marsa-gold/40 transition-all duration-500 hover:-translate-y-1 shadow-sm"
        >
          <fa-icon [icon]="linkedinIcon" class="text-xl"></fa-icon>
        </a>
      </div>
    </div>
  </div>
</footer>
